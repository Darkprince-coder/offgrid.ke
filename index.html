<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta (overridden per-page by SEOHead.jsx) -->
    <title>OFFGRID.KE — Kenya's Free Off-Grid Guide</title>
    <meta name="description" content="Free guides, real local prices, and practical advice for going off-grid in Kenya. Solar, water, and security for homeowners, farmers, and small businesses." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://offgrid.ke/" />

    <!-- Geo targeting -->
    <meta name="geo.region"    content="KE" />
    <meta name="geo.placename" content="Kenya" />
    <meta name="language"      content="English" />

    <!-- Open Graph base -->
    <meta property="og:site_name"   content="OFFGRID.KE" />
    <meta property="og:locale"      content="en_KE" />
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="OFFGRID.KE — Kenya's Free Off-Grid Guide" />
    <meta property="og:description" content="Free guides, real local prices, and practical advice for going off-grid in Kenya." />
    <meta property="og:url"         content="https://offgrid.ke/" />
    <meta property="og:image"       content="https://offgrid.ke/og-default.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="OFFGRID.KE — Kenya's Free Off-Grid Guide" />
    <meta name="twitter:description" content="Free guides, real local prices, and practical advice for going off-grid in Kenya." />
    <meta name="twitter:image"       content="https://offgrid.ke/og-default.jpg" />

   

   <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon"             href="/favicon.ico" sizes="any" />
    <link rel="icon"             href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!--
      PERFORMANCE: Preconnect before font request so the browser
      opens the connection to Google Fonts early. font-display=swap
      ensures text renders immediately in a fallback font.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Base JSON-LD (overridden per page by SEOHead) -->
    <script id="json-ld-schema" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OFFGRID.KE",
      "url": "https://offgrid.ke",
      "description": "Free guides, real local prices, and practical advice for going off-grid in Kenya.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://offgrid.ke/posts?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
